    /* === ESSAY OVERRIDES === */
    body {
      background: var(--theme-bg);
      font-family: 'Outfit', sans-serif;
    }

    .chapter-page {
      max-width: none;
      /* Top padding clears the fixed #site-header — this page-specific
         override replaces chapter.css's own .chapter-page padding
         entirely, so the header clearance has to be repeated here too. */
      padding: 76px 6vw 80px;
    }

    .essay-header {
      padding: 80px 0 48px;
    }

    .essay-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 400;
      color: var(--theme-ink);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .essay-header .subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      color: var(--theme-ink-secondary);
      font-weight: 300;
      letter-spacing: 0.03em;
    }

    /* === ESSAY BODY === */
    .essay-body {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #c8c8d4;
    }

    .essay-body p {
      margin-bottom: 28px;
    }

    /* === TAB TOGGLE === */
    .tab-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    /* Same offset-shadow button family as the header/nav CTAs. */
    .tab-btn {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 9px 20px;
      border-radius: 3px;
      border: 2px solid var(--theme-structural);
      background: transparent;
      color: var(--theme-ink);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, color 0.15s ease;
    }

    .tab-btn.active {
      background: var(--theme-resume-bg);
      color: var(--theme-resume-ink);
      border-color: var(--theme-resume-ink);
      box-shadow: 3px 3px 0 var(--theme-structural);
    }

    .tab-btn:not(.active):hover {
      background: var(--theme-structural);
      color: #fff;
    }

    /* === TAB PANELS === */
    .tab-panel {
      display: none;
      opacity: 0;
    }

    .tab-panel.active {
      display: block;
      animation: panelIn 0.35s ease forwards;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === TIMELINE === */
    .timeline {
      position: relative;
      padding-left: 32px;
      margin-top: 8px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--theme-structural);
    }

    .timeline-card {
      position: relative;
      background: var(--theme-bg);
      border: 2px solid var(--theme-structural);
      border-radius: 3px;
      padding: 28px;
      margin-bottom: 24px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      opacity: 0;
      transform: translateY(16px);
    }

    .timeline-card.animate-in {
      animation: cardSlideIn 0.4s ease forwards;
    }

    @keyframes cardSlideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .timeline-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--theme-structural);
    }

    .timeline-card::before {
      content: '';
      position: absolute;
      left: -38px;
      top: 34px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--theme-structural);
      border: 2px solid var(--theme-bg);
    }

    .tl-role {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--theme-structural);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .tl-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--theme-ink-secondary);
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tl-company { color: var(--theme-ink-secondary); }
    .tl-date { color: var(--theme-ink-secondary); white-space: nowrap; }

    .tl-desc {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #c8c8d4;
      margin-bottom: 16px;
    }

    .tl-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tl-pill {
      padding: 4px 14px;
      background: transparent;
      border: 2px solid var(--theme-structural);
      border-radius: 3px;
      font-size: 0.78rem;
      color: var(--theme-ink);
      font-weight: 400;
    }

    .tl-role a,
    .tl-desc a {
      color: var(--theme-structural);
      text-decoration: none;
      transition: text-decoration 0.2s ease;
    }

    .tl-role a:hover,
    .tl-desc a:hover {
      text-decoration: underline;
    }

    /* === CHAPTER NAV === */
    .next-chapter {
      margin-top: 80px;
      padding-top: 40px;
      border-top: 2px solid var(--theme-structural);
      text-align: right;
    }

    .next-chapter .next-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      color: var(--theme-ink-secondary);
    }

    .next-chapter .next-title {
      font-size: 1rem;
      color: var(--theme-ink);
      font-weight: 500;
    }

    /* === MOBILE === */
    @media (max-width: 768px) {
      .essay-header {
        padding: 48px 0 32px;
      }

      .tab-toggle {
        flex-wrap: wrap;
      }

      .timeline {
        padding-left: 24px;
      }

      .timeline-card {
        padding: 20px;
      }

      .timeline-card::before {
        left: -30px;
      }
    }
  </style>

  <script>
    /* =====================================================
       TAB SWITCHING
       ===================================================== */

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        // Toggle button active state
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Toggle panels
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById('panel-' + tab);
        if (panel) {
          panel.classList.add('active');

          // Stagger-animate timeline cards
          if (tab === 'work') {
            const cards = panel.querySelectorAll('.timeline-card');
            cards.forEach((card, i) => {
              card.classList.remove('animate-in');
              void card.offsetWidth;
              setTimeout(() => {
                card.classList.add('animate-in');
              }, i * 100);
            });
          }
        }
      });
    });
  </script>
<div id="star-cursor"></div>
<script>
(function() {
  const star = document.getElementById('star-cursor');
  star.innerHTML = '✦';
  star.style.color = '#c8d0e8';
  star.style.fontFamily = 'serif';

  document.addEventListener('mousemove', (e) => {
    star.style.left = e.clientX + 'px';
    star.style.top = e.clientY + 'px';
  });

  document.querySelectorAll('a, button, [data-hover]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      star.classList.add('big');
      star.style.color = '#7c8ff7';
    });
    el.addEventListener('mouseleave', () => {
      star.classList.remove('big');
      star.style.color = '#c8d0e8';
    });
  });

  document.addEventListener('click', () => {
    star.style.transition = 'transform 0.3s ease';
    star.style.transform = 'translate(-50%, -50%) rotate(360deg)';
    setTimeout(() => {
      star.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }, 300);
  });
})();
</script>
