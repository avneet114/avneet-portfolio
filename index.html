  <!-- Hero intro plays once per browser session — every fresh visit
       (new tab, reopening the browser) shows it again, but navigating
       back to "/" within the same tab (e.g. clicking the header logo)
       doesn't replay it. sessionStorage, not localStorage, is what
       gives that: cleared on a new session, kept across navigations
       within one. Runs synchronously before paint — same reasoning as
       the old day/night init script had — so there's no flash of the
       intro for a same-session return. Sets the class on <html>, not
       <body> (body doesn't exist yet this early in <head>). -->
  <script>
    if (!sessionStorage.getItem('introSeen')) {
      document.documentElement.classList.add('intro-active');
    }

  <script>
    // The globe measures #globe-container at DOMContentLoaded. Now that the
    // container is a letterboxed stage, fire one resize after full load so
    // it re-measures the settled layout and re-centres in its frame.
    // Uses the resize handler script.js already registers — no globe code changed.

  <!-- Hero intro bubble sequence — one line at a time, auto-advancing
       every 2s or on click/Enter/Space. The last line is the CTA;
       advancing past it removes .intro-active from <html> and sets
       sessionStorage so it doesn't replay again this session (see the
       early script in <head>). -->
  <script>
    (function() {
      const intro   = document.getElementById('hero-intro');
      const video   = document.getElementById('hero-intro-video');
      const bubble  = document.getElementById('hero-intro-bubble');
      const textEl  = document.getElementById('hero-intro-text');
      const hintEl  = document.getElementById('hero-intro-hint');
      const skipEl  = document.getElementById('hero-intro-skip');

      // Returning visitor — <html> never got .intro-active, so there's
      // nothing to sequence. Stop the video outright rather than let
      // an autoplay+loop element burn bandwidth invisibly forever.
      if (!document.documentElement.classList.contains('intro-active')) {
        video.pause();
        video.removeAttribute('src');
        video.load();
        return;
      }

      const LINES = [
        { text: "hi, i'm avneet", type: 'headline' },
        { text: "welcome to my world.", type: 'headline' },
        { text: "Avneet is a creative soul who can't sit still." },
        { text: "She taught herself video production at 12 and started her first business at 13." },
        { text: "Since then, she's worked with startups across three continents in roles spanning software engineering, product, creative, and everything in between." },
        { text: "Among the million things she's done since then, she's currently studying Computer Science and Business at Lehigh University while building AI products." },
        { text: "She's also exploring how technology can reshape the future of education." },
        { text: "A generalist at heart, she loves tackling messy problems, learning new things, and turning ideas into reality." },
        { text: "Wanna learn more about my journey? Follow along ;)", type: 'cta' }
      ];

      let step = 0;
      let autoTimer = null;

      function render() {
        const line = LINES[step];
        const isLast = step === LINES.length - 1;
        textEl.textContent = line.text;
        bubble.className = 'hero-intro-bubble' + (line.type ? ' ' + line.type : '');
        hintEl.textContent = isLast ? '' : 'Next ›';
        skipEl.textContent = isLast ? "Let's go" : 'Skip ✕';
      }

      // Longer lines get more reading time — 2s floor, 4s ceiling,
      // scaled by word count in between.
      function durationFor(text) {
        const words = text.split(/\s+/).length;
        return Math.min(4000, Math.max(2000, 1400 + words * 110));
      }

      function scheduleAuto() {
        clearTimeout(autoTimer);
        if (step < LINES.length - 1) {
          autoTimer = setTimeout(advance, durationFor(LINES[step].text));
        }
      }

      function dismiss() {
        clearTimeout(autoTimer);
        document.documentElement.classList.remove('intro-active');
        sessionStorage.setItem('introSeen', '1');
      }

      function advance() {
        if (step < LINES.length - 1) {
          step += 1;
          render();
          scheduleAuto();
        } else {
          dismiss();
        }
      }

      intro.addEventListener('click', advance);
      intro.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          advance();
        }
      });

      // Own handler, stops propagation so it doesn't also fire the
      // parent's advance-on-click — skipping should jump straight to
      // dismiss regardless of which line is currently showing.
      skipEl.addEventListener('click', function(e) {
        e.stopPropagation();
        dismiss();
      });

      render();
      scheduleAuto();
    })();
  </script>

<script>
(function() {
  const applePaySound = new Audio('assets/applepay.mp3');
  applePaySound.preload = 'auto';
  const clickSound = new Audio('assets/click.mp3');
  clickSound.preload = 'auto';

  // Capture phase — pin clicks call e.stopPropagation() inside script.js
  // (part of the tooltip logic that's off-limits to touch), which blocks
  // normal bubble-phase listeners like this one from ever seeing the
  // click. Capture fires on the way DOWN, before that stopPropagation
  // runs, so this still sees every click including pins.
  document.addEventListener('click', function(e) {
    // Skip for "Explore This Chapter" link — it has its own sound
    if (e.target.closest('#tt-link')) return;
    // Header is Layer 1 — keep it silent so RESUME/email never make noise
    if (e.target.closest('#site-header')) return;
    // Only real controls make noise — clicking empty globe/page
    // background (e.g. dragging the globe) stays silent.
    const isControl = e.target.closest('button, a, [role="button"], .globe-pin');
    if (!isControl) return;
    // Apple Pay chime is reserved for actually clicking a country pin —
    // every other control (tour panel, hero intro bubble, reopen
    // button, any other button on the page) gets the lowkey click
    // sound instead.
    if (e.target.closest('.globe-pin')) {
      applePaySound.currentTime = 0;
      applePaySound.play();
    } else {
      clickSound.currentTime = 0;
      clickSound.play();
    }
  }, true);
})();
</script>

<script>
(function() {
  const star = document.getElementById('star-cursor');
  star.innerHTML = '✦';
  star.style.color = 'var(--cursor-idle)';
  star.style.fontFamily = 'serif';

  document.addEventListener('mousemove', (e) => {
    star.style.left = e.clientX + 'px';
    star.style.top = e.clientY + 'px';
  });

  document.querySelectorAll('a, button, [data-hover]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      star.classList.add('big');
      star.style.color = 'var(--cursor-hover)';
    });
    el.addEventListener('mouseleave', () => {
      star.classList.remove('big');
      star.style.color = 'var(--cursor-idle)';
    });
  });

  document.addEventListener('click', () => {
    star.style.transition = 'transform 0.3s ease';
    star.style.transform = 'translate(-50%, -50%) rotate(360deg)';
    setTimeout(() => {
      star.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }, 300);
  });
})();
</script>

<script>
(function() {
  var stack = document.getElementById('photo-stack');
  if (!stack) return;
  var photos = document.querySelectorAll('.stack-photo');

  function isMobile() { return window.innerWidth <= 768; }

  // Desktop fan positions
  var fanPositions = [
    { left: 3,  top: 8,  rotate: -8 },
    { left: 2,  top: 38, rotate: -3 },
    { left: 8,  top: 68, rotate: 5 },
    { left: 25, top: 78, rotate: 10 },
    { left: 50, top: 80, rotate: -5 },
    { left: 72, top: 70, rotate: 7 },
    { left: 82, top: 45, rotate: -4 },
    { left: 78, top: 8,  rotate: 6 },
    { left: 55, top: 5,  rotate: -7 },
    { left: 30, top: 3,  rotate: 3 }
  ];

  // Mobile fan positions — scattered across full screen (max left ~50vw for 80px photos)
  var mobileFanPositions = [
    { left: 5,  top: 3,  rotate: -6 },
    { left: 48, top: 2,  rotate: 4 },
    { left: 2,  top: 20, rotate: 3 },
    { left: 45, top: 18, rotate: -5 },
    { left: 20, top: 36, rotate: 7 },
    { left: 50, top: 38, rotate: -3 },
    { left: 3,  top: 54, rotate: -4 },
    { left: 45, top: 56, rotate: 6 },
    { left: 8,  top: 72, rotate: 2 },
    { left: 48, top: 74, rotate: -7 }
  ];

  function getPositions() {
    return isMobile() ? mobileFanPositions : fanPositions;
  }

  var isExpanded = false;
  var collapseTimer;

  function expand() {
    clearTimeout(collapseTimer);
    if (isExpanded) return;
    isExpanded = true;
    var positions = getPositions();
    photos.forEach(function(photo, i) {
      var pos = positions[i];
      photo.style.position = 'fixed';
      photo.style.left = pos.left + 'vw';
      photo.style.top = pos.top + 'vh';
      photo.style.transform = 'rotate(' + pos.rotate + 'deg)';
      photo.style.zIndex = 1000 + i;
      photo.style.pointerEvents = 'auto';
    });
  }

  function collapse(immediate) {
    clearTimeout(collapseTimer);
    var delay = immediate ? 0 : 300;
    collapseTimer = setTimeout(function() {
      isExpanded = false;
      photos.forEach(function(photo) {
        photo.style.position = 'absolute';
        photo.style.left = '';
        photo.style.top = '';
        photo.style.transform = '';
        photo.style.zIndex = '';
        photo.style.pointerEvents = '';
        photo.classList.remove('tilting');
      });
    }, delay);
  }

  // Desktop: hover to expand
  stack.addEventListener('mouseenter', expand);
  stack.addEventListener('mouseleave', function() {
    // Don't collapse — photos are now fixed outside the container
  });

  // Mobile: tap stack to toggle
  stack.addEventListener('click', function(e) {
    if (!isMobile()) return;
    e.stopPropagation();
    if (isExpanded) {
      collapse(true);
    } else {
      expand();
    }
  });

  // Mobile: tap outside photos to collapse
  document.addEventListener('click', function(e) {
    if (!isMobile() || !isExpanded) return;
    if (e.target.closest('#photo-stack') || e.target.classList.contains('stack-photo')) return;
    collapse(true);
  });

  // Re-position on resize/orientation change
  window.addEventListener('resize', function() {
    if (!isExpanded) return;
    var positions = getPositions();
    photos.forEach(function(photo, i) {
      var pos = positions[i];
      photo.style.left = pos.left + 'vw';
      photo.style.top = pos.top + 'vh';
      photo.style.transform = 'rotate(' + pos.rotate + 'deg)';
    });
  });

  // Hover sound (desktop only)
  var hoverSound = new Audio('assets/pokemon.mp3');
  hoverSound.volume = 0.3;

  // Per-photo hover effects (desktop only) + collapse on leave
  photos.forEach(function(photo) {
    photo.addEventListener('mouseenter', function() {
      clearTimeout(collapseTimer);
      if (!isExpanded || isMobile()) return;
      photo.classList.add('tilting');
      if (photo.id === 'sphoto7') {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(function(){});
      }
    });

    photo.addEventListener('mousemove', function(e) {
      if (isMobile()) return;
      if (!isExpanded || !photo.classList.contains('tilting')) return;
      var rect = photo.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width;
      var y = (e.clientY - rect.top) / rect.height;
      var tiltX = (0.5 - y) * 30;
      var tiltY = (x - 0.5) * 30;
      var positions = getPositions();
      var fanPos = positions[Array.prototype.indexOf.call(photos, photo)];
      var baseRotate = fanPos ? fanPos.rotate : 0;
      photo.style.transform = 'perspective(400px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) rotate(' + baseRotate + 'deg) scale(1.15)';
    });

    // Mobile: 3D tilt via touch
    photo.addEventListener('touchstart', function(e) {
      if (!isMobile() || !isExpanded) return;
      photo.classList.add('tilting');
      if (photo.id === 'sphoto7') {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(function(){});
      }
    }, { passive: true });

    photo.addEventListener('touchmove', function(e) {
      if (!isMobile() || !isExpanded || !photo.classList.contains('tilting')) return;
      var touch = e.touches[0];
      var rect = photo.getBoundingClientRect();
      var x = (touch.clientX - rect.left) / rect.width;
      var y = (touch.clientY - rect.top) / rect.height;
      var tiltX = (0.5 - y) * 25;
      var tiltY = (x - 0.5) * 25;
      var positions = getPositions();
      var fanPos = positions[Array.prototype.indexOf.call(photos, photo)];
      var baseRotate = fanPos ? fanPos.rotate : 0;
      photo.style.transform = 'perspective(400px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) rotate(' + baseRotate + 'deg) scale(1.15)';
    }, { passive: true });

    photo.addEventListener('touchend', function() {
      if (!isMobile()) return;
      photo.classList.remove('tilting');
      if (isExpanded) {
        var i = Array.prototype.indexOf.call(photos, photo);
        var positions = getPositions();
        var pos = positions[i];
        if (pos) {
          photo.style.transform = 'rotate(' + pos.rotate + 'deg)';
        }
      }
    });

    photo.addEventListener('mouseleave', function() {
      if (isMobile()) return;
      photo.classList.remove('tilting');
      if (isExpanded) {
        var i = Array.prototype.indexOf.call(photos, photo);
        var positions = getPositions();
        var pos = positions[i];
        if (pos) {
          photo.style.transform = 'rotate(' + pos.rotate + 'deg)';
        }
      }
      if (!isExpanded) return;
      collapseTimer = setTimeout(function() {
        isExpanded = false;
        photos.forEach(function(p) {
          p.style.position = 'absolute';
          p.style.left = '';
          p.style.top = '';
          p.style.transform = '';
          p.style.zIndex = '';
          p.style.pointerEvents = '';
          p.classList.remove('tilting');
        });
      }, 400);
    });
  });
})();
</script>
